# railway.toml
# Monorepo deployment config for Railway
# Each [service] block maps to a Railway service in the same project

[build]
builder = "nixpacks"

# ── API Service ───────────────────────────────────────────────
# Set this file as the root config for the API service
# In Railway dashboard: set root directory to /apps/api for the API service

[deploy]
startCommand = "node dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
