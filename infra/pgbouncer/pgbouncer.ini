[databases]
; Route all taskflow connections through the pool
; DATABASE_URL in your app should point to PgBouncer (port 6432), NOT Postgres directly
taskflow = host=postgres-host port=5432 dbname=railway

[pgbouncer]
; ── Pool settings ──────────────────────────────────────────────────────────
; Transaction pooling: best for 10,000+ concurrent users
; Each server connection is released back to the pool after every TRANSACTION
; This allows ~200 server connections to serve thousands of simultaneous clients
pool_mode = transaction

; Maximum total server-side (Postgres) connections PgBouncer will open
; PostgreSQL default max_connections = 100; raise it to 500 in postgresql.conf
; then set this slightly below: 400 = headroom for admin connections
max_client_conn = 10000
default_pool_size = 200
min_pool_size = 20
reserve_pool_size = 50
reserve_pool_timeout = 3

; ── Network ────────────────────────────────────────────────────────────────
listen_addr = 0.0.0.0
listen_port = 6432

; ── Auth ───────────────────────────────────────────────────────────────────
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; ── Timeouts ───────────────────────────────────────────────────────────────
server_idle_timeout = 600
client_idle_timeout = 0
server_connect_timeout = 5
query_timeout = 30
query_wait_timeout = 10
client_login_timeout = 10

; ── Logging (keep minimal in prod for performance) ─────────────────────────
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1

; ── TLS to backend ─────────────────────────────────────────────────────────
server_tls_sslmode = require
